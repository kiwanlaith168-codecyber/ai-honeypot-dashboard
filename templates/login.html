<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honeypot — Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(30,136,229,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,136,229,.08) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    .card {
      background: rgba(22, 33, 62, 0.95);
      border: 1px solid rgba(30,136,229,.3);
      border-radius: 16px;
      padding: 48px 40px;
      width: 420px;
      box-shadow: 0 0 60px rgba(30,136,229,.15), 0 20px 40px rgba(0,0,0,.5);
      position: relative;
      z-index: 10;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 56px;
      display: block;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(229,57,53,.6));
    }
    .logo h1 {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo p {
      color: #78909c;
      font-size: 12px;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(229,57,53,.15);
      border: 1px solid rgba(229,57,53,.4);
      color: #ef9a9a;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #e53935;
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      color: #90a4ae;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      transition: all .2s;
      outline: none;
    }
    input:focus {
      border-color: #1e88e5;
      background: rgba(30,136,229,.08);
      box-shadow: 0 0 0 3px rgba(30,136,229,.15);
    }

    .error-msg {
      background: rgba(229,57,53,.15);
      border: 1px solid rgba(229,57,53,.4);
      color: #ef9a9a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button[type=submit] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1565c0, #1e88e5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all .2s;
      text-transform: uppercase;
      margin-top: 8px;
    }
    button[type=submit]:hover {
      background: linear-gradient(135deg, #1e88e5, #42a5f5);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(30,136,229,.35);
    }

    .footer-note {
      text-align: center;
      color: #37474f;
      font-size: 11px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🍯</span>
      <h1>AI Honeypot System</h1>
      <p>Security Operations Center</p>
    </div>

    <div style="text-align:center">
      <span class="badge">RESTRICTED ACCESS</span>
    </div>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter admin username"
               autocomplete="username" required autofocus />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••••"
               autocomplete="current-password" required />
      </div>
      <button type="submit">🔐 Secure Login</button>
    </form>

    <p class="footer-note">
      All access attempts are logged and monitored.<br/>
      Unauthorized access is prohibited.
    </p>
  </div>
</body>
</html>
